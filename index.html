<html lang="ja">
<head>

<title>PRODUCE 101 JAPAN 新世界｜好き顔9選</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --pink:#f39abb;
  --pink2:#fff0f6;
  --text:#333;
  --muted:#999;
  --line:#f0dce5;
  --white:#fff;
}

html,body{
  margin:0;
  padding:0;
  background:#fff8fb;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:24px 16px 48px;
}

.hidden{
  display:none!important;
}

.header{
  text-align:center;
}

.kicker{
  font-size:11px;
  letter-spacing:.12em;
  color:#aaa;
}

.logo{
  margin:5px 0 0;
  font-size:25px;
  font-weight:900;
  letter-spacing:.02em;
}

.pink{
  color:var(--pink);
}

.lead{
  margin:5px 0 0;
  color:#777;
  font-size:13px;
}

.start-visual{
  margin:42px auto 24px;
  width:180px;
  height:180px;
  border-radius:50%;
  background:linear-gradient(
    145deg,
    #fff,
    #ffe8f2
  );
  display:grid;
  place-items:center;
  font-size:72px;
  box-shadow:0 12px 35px rgba(230,130,170,.15);
}

.info{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  margin-top:22px;
  text-align:center;
  font-size:13px;
  line-height:1.8;
}

.main-button{
  width:100%;
  border:0;
  border-radius:999px;
  background:var(--pink);
  color:white;
  font-weight:800;
  padding:16px;
  margin-top:22px;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(239,145,180,.22);
}

.main-button:active{
  transform:scale(.98);
}

.progress-area{
  margin:24px 0 15px;
}

.progress-label{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#aaa;
  margin-bottom:7px;
}

.progress{
  width:100%;
  height:6px;
  background:#f0e5e9;
  border-radius:999px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0;
  background:var(--pink);
  transition:width .25s ease;
}

.question{
  text-align:center;
  font-weight:800;
  font-size:17px;
  margin:18px 0 13px;
}

.choices{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  width:100%;
}

.choice{
  display:block;
  width:100%;
  min-width:0;
  border:0;
  padding:0;
  margin:0;
  background:white;
  border-radius:19px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(100,50,70,.09);
  cursor:pointer;
  transition:transform .13s,opacity .13s;
}

.choice:active{
  transform:scale(.965);
}

.photo{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:3/4;
  object-fit:cover;
  background:#f5edf1;
}

.choice-name{
  min-height:47px;
  display:grid;
  place-items:center;
  padding:8px 5px;
  font-size:13px;
  font-weight:800;
}

.hint{
  text-align:center;
  color:#aaa;
  font-size:11px;
  margin-top:14px;
}

.result-header{
  text-align:center;
  margin-bottom:20px;
}

.result-header h2{
  margin:7px 0 2px;
  font-size:28px;
}

.result-header p{
  margin:0;
  font-size:12px;
  color:#aaa;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.result-card{
  position:relative;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(80,40,60,.07);
}

.result-photo{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
  background:#f5edf1;
}

.rank{
  position:absolute;
  left:5px;
  top:5px;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#fff;
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:900;
}

.result-name{
  text-align:center;
  padding:7px 2px 9px;
  font-size:10px;
  line-height:1.25;
  font-weight:800;
}

.result-actions{
  display:grid;
  gap:9px;
  margin-top:18px;
}

.secondary-button{
  width:100%;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  padding:13px;
  font-weight:800;
  color:#777;
  cursor:pointer;
}

.note{
  text-align:center;
  color:#aaa;
  font-size:10px;
  line-height:1.7;
  margin:17px 5px 0;
}

@media(max-width:350px){

  .app{
    padding-left:11px;
    padding-right:11px;
  }

  .choices{
    gap:8px;
  }

  .choice-name{
    font-size:11px;
  }

}
</style>
</head>

  ["釼持 吉成","kenmotsukinari"],

];


/* ============================================================
   人物データ生成
============================================================ */

const candidates =
  PEOPLE.map((p,index)=>({

    id:String(index+1),

    name:p[0],

    slug:p[1],

    image:
      CUSTOM_IMAGES[p[1]] ||
      IMAGE_BASE+p[1]+".jpg",

    rating:1500,

    comparisons:0,

    wins:0,

    losses:0

  }));


/* ============================================================
   ゲーム設定
============================================================ */

const INITIAL_TARGET =
  candidates.length * 8 / 2;

const FINALISTS = 18;

const FINAL_ROUNDS = 60;


/* ============================================================
   状態
============================================================ */

let players=[];

let phase="initial";

let round=0;

let currentLeft=null;

let currentRight=null;

let resultPeople=[];


/* ============================================================
   DOM
============================================================ */

const startScreen =
  document.getElementById("startScreen");

const gameScreen =
  document.getElementById("gameScreen");

const resultScreen =
  document.getElementById("resultScreen");

const startButton =
  document.getElementById("startButton");

const restartButton =
  document.getElementById("restartButton");

const shareButton =
  document.getElementById("shareButton");

const leftChoice =
  document.getElementById("leftChoice");

const rightChoice =
  document.getElementById("rightChoice");

const leftImage =
  document.getElementById("leftImage");

const rightImage =
  document.getElementById("rightImage");

const leftName =
  document.getElementById("leftName");

const rightName =
  document.getElementById("rightName");

const progressText =
  document.getElementById("progressText");

const progressBar =
  document.getElementById("progressBar");

const phaseLabel =
  document.getElementById("phaseLabel");

const ranking =
  document.getElementById("ranking");


/* ============================================================
   画像エラー対策
============================================================ */

function setImage(img,person){

  img.onerror=()=>{

    img.onerror=null;

    const svg=`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 600 800"
      >

        <rect
          width="600"
          height="800"
          fill="#f6edf1"
        />

        <text
          x="300"
          y="350"
          text-anchor="middle"
          font-size="34"
          font-family="sans-serif"
          font-weight="700"
          fill="#aaa"
        >
          ${escapeSvg(person.name)}
        </text>

        <text
          x="300"
          y="405"
          text-anchor="middle"
          font-size="22"
          font-family="sans-serif"
          fill="#c5aeb8"
        >
          PROFILE
        </text>

      </svg>

    `;

    img.src=
      "data:image/svg+xml;charset=UTF-8,"+
      encodeURIComponent(svg);

  };

  img.src=person.image;

}


function escapeSvg(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&apos;");

}


/* ============================================================
   スタート
============================================================ */

function startGame(){

  players=
    candidates.map(p=>({

      ...p,

      rating:1500,

      comparisons:0,

      wins:0,

      losses:0

    }));

  phase="initial";

  round=0;

  resultPeople=[];

  startScreen.classList.add("hidden");

  resultScreen.classList.add("hidden");

  gameScreen.classList.remove("hidden");

  nextQuestion();

}


/* ============================================================
   初期比較ペア
============================================================ */

function chooseInitialPair(){

  const min=
    Math.min(
      ...players.map(
        p=>p.comparisons
      )
    );


  const pool=
    players.filter(
      p=>p.comparisons<=min+1
    );


  const left=
    pool[
      Math.floor(
        Math.random()*pool.length
      )
    ];


  const opponents=
    players
      .filter(
        p=>p.id!==left.id
      )
      .sort((a,b)=>{

        const countDifference=
          a.comparisons-b.comparisons;

        const ratingDifference=
          Math.abs(
            a.rating-left.rating
          )-
          Math.abs(
            b.rating-left.rating
          );

        return(
          countDifference*20+
          ratingDifference
        );

      });


  const top=
    opponents.slice(
      0,
      Math.min(
        14,
        opponents.length
      )
    );


  const right=
    top[
      Math.floor(
        Math.random()*top.length
      )
    ];


  return[
    left,
    right
  ];

}


/* ============================================================
   決勝ペア
============================================================ */

function chooseFinalPair(){

  const sorted=
    [...players]
      .sort(
        (a,b)=>
          b.rating-a.rating
      );


  const left=
    sorted[
      Math.floor(
        Math.random()*
        Math.min(
          sorted.length,
          FINALISTS
        )
      )
    ];


  const opponents=
    sorted
      .filter(
        p=>p.id!==left.id
      )
      .sort(
        (a,b)=>
          Math.abs(
            a.rating-left.rating
          )-
          Math.abs(
            b.rating-left.rating
          )
      );


  const pool=
    opponents.slice(
      0,
      Math.min(
        8,
        opponents.length
      )
    );


  const right=
    pool[
      Math.floor(
        Math.random()*pool.length
      )
    ];


  return[
    left,
    right
  ];

}


/* ============================================================
   次の問題
============================================================ */

function nextQuestion(){

  let total;


  if(phase==="initial"){

    total=
      Math.ceil(
        INITIAL_TARGET
      );

  }else{

    total=
      FINAL_ROUNDS;

  }


  if(round>=total){

    if(phase==="initial"){

      startFinal();

      return;

    }


    showResult();

    return;

  }


  let pair;


  if(phase==="initial"){

    pair=
      chooseInitialPair();

  }else{

    pair=
      chooseFinalPair();

  }


  currentLeft=
    pair[0];

  currentRight=
    pair[1];


  setImage(
    leftImage,
    currentLeft
  );

  setImage(
    rightImage,
    currentRight
  );


  leftImage.alt=
    currentLeft.name;

  rightImage.alt=
    currentRight.name;


  leftName.textContent=
    currentLeft.name;

  rightName.textContent=
    currentRight.name;


  round++;


  progressText.textContent=
    `${round} / ${total}`;


  phaseLabel.textContent=
    phase==="initial"
      ? "全体比較"
      : "TOP9決定戦";


  progressBar.style.width=
    `${Math.min(
      100,
      round/total*100
    )}%`;

}


/* ============================================================
   勝敗
============================================================ */

function chooseWinner(
  winner,
  loser
){

  const winnerRating=
    winner.rating;

  const loserRating=
    loser.rating;


  const expectedWinner=
    1/
    (
      1+
      Math.pow(
        10,
        (
          loserRating-
          winnerRating
        )/400
      )
    );


  const K=
    phase==="initial"
      ? 32
      : 20;


  winner.rating=
    winnerRating+
    K*(1-expectedWinner);


  loser.rating=
    loserRating-
    K*(1-expectedWinner);


  winner.comparisons++;

  loser.comparisons++;

  winner.wins++;

  loser.losses++;


  nextQuestion();

}


/* ============================================================
   決勝開始
============================================================ */

function startFinal(){

  players=
    [...players]
      .sort(
        (a,b)=>
          b.rating-a.rating
      )
      .slice(
        0,
        FINALISTS
      );


  phase="final";

  round=0;

  progressBar.style.width="0%";

  nextQuestion();

}


/* ============================================================
   結果
============================================================ */

function showResult(){

  gameScreen.classList.add("hidden");

  resultScreen.classList.remove("hidden");


  resultPeople=
    [...players]
      .sort(
        (a,b)=>
          b.rating-a.rating
      )
      .slice(
        0,
        9
      );


  ranking.innerHTML="";


  resultPeople.forEach(
    (person,index)=>{

      const card=
        document.createElement("div");

      card.className=
        "result-card";


      const img=
        document.createElement("img");

      img.className=
        "result-photo";

      img.alt=
        person.name;


      setImage(
        img,
        person
      );


      const rank=
        document.createElement("div");

      rank.className=
        "rank";

      rank.textContent=
        index+1;


      const name=
        document.createElement("div");

      name.className=
        "result-name";

      name.textContent=
        person.name;


      card.appendChild(img);

      card.appendChild(rank);

      card.appendChild(name);

      ranking.appendChild(card);

    }
  );

}

        "#PRODUCE101JAPAN新世界",
        "#日プ新世界",
        "#好き顔9選"
      ].join("\n");

);


/* ============================================================
   ボタン
============================================================ */

startButton.addEventListener(
  "click",
  startGame
);


restartButton.addEventListener(
  "click",
  startGame
);


leftChoice.addEventListener(
  "click",
  ()=>{

    if(
      !currentLeft||
      !currentRight
    )
      return;

    chooseWinner(
      currentLeft,
      currentRight
    );

  }
);


rightChoice.addEventListener(
  "click",
  ()=>{

    if(
      !currentLeft||
      !currentRight
    )
      return;

    chooseWinner(
      currentRight,
      currentLeft
    );

  }
);

if(candidates.length<9){

  alert(

  );
